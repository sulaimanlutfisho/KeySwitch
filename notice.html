<!DOCTYPE html>
<html lang="ar" dir="rtl" data-id="notice_v1">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إشعار جديد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: rgba(11, 15, 25, 0.92);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .announcement-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
        }

        .card-icon {
            font-size: 2.8rem;
            color: #3b82f6;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .card-body {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn-read {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-read:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }
    </style>
</head>

<body>

    <div class="announcement-card">
        <i class="fa-solid fa-lightbulb card-icon"></i>
        <h2 class="card-title">نصيحة تقنية اليوم</h2>
        <p class="card-body">
            لا تنسَ أداء الصلاة في وقتها، واستقطاع وقت للراحة لتجديد نشاطك أثناء البرمجة!
        </p>
        <button class="btn-read" onclick="markAsRead()">
            <i class="fa-solid fa-check"></i> تمت القراءة
        </button>
    </div>

    <script>
        function markAsRead() {
            const noticeId = document.documentElement.getAttribute('data-id') || 'notice_v2';
            window.parent.postMessage({
                type: 'MARK_ANNOUNCEMENT_READ',
                id: noticeId
            }, '*');
        }
    </script>
</body>

</html>
