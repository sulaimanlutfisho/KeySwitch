<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .update-card {
      background: #0f172a;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 24px;
      padding: 24px;
      width: 320px;
      text-align: center;
      color: #f8fafc;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0 0 10px 0;
      font-size: 1.3rem;
      color: #10b981;
    }

    p {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn-download {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }

    .btn-skip {
      background: transparent;
      color: #64748b;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <div class="update-card" data-version="1.0.1">
    <div class="icon">🚀</div>
    <h2>تحديث جديد متوفر!</h2>
    <p>يتوفر إصدار جديد من KeySwitch يحوي إصلاحات وتحسينات في السرعة.</p>

    <button class="btn-download"
      data-url="https://github.com/sulaimanlutfisho/KeySwitch/releases/download/v1.0.1/keyswitch_0.1.0_x64-setup.exe">
      تحميل التحديث الآن
    </button>
    <br>
    <button class="btn-skip">تخطي حالياً</button>
  </div>

  <script>
    // عند الضغط على زر التحميل
    document.querySelector('.btn-download').addEventListener('click', (e) => {
      const url = e.target.getAttribute('data-url');
      window.parent.postMessage({ type: 'DOWNLOAD_UPDATE', url: url }, '*');
    });

    // عند الضغط على زر التخطي
    document.querySelector('.btn-skip').addEventListener('click', () => {
      window.parent.postMessage({ type: 'CLOSE_UPDATE_MODAL' }, '*');
    });
  </script>
</body>

</html>
